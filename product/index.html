<!DOCTYPE html>
<html>
<head>
    <title>Product Search </title>
</head>
<body>

<h1>Product Search</h1>


<input id="searchBox" placeholder="Type 3 characters to search..." type="text">


<div id="results"></div>

<div id="selected"></div>

<script>

    // Get HTML elements
    var searchBox = document.getElementById('searchBox');
    var results   = document.getElementById('results');
    var selected  = document.getElementById('selected');

    // When user types something
    searchBox.addEventListener('input', function() {
        var query = this.value;
        if (query.length < 3) {
            results.innerHTML = '';
            return;
        }
        searchProducts(query);
    });

    // AJAX - talk to search.php
    function searchProducts(query) {
        var obj = new XMLHttpRequest();
        obj.open("GET", "search.php?q=" + query, true);
        obj.send();

        obj.onreadystatechange = function() {
            if (obj.readyState == 4 && obj.status == 200) {
                var data = JSON.parse(obj.responseText);
                showResults(data);
            }
        };
    }

    // Show results on page
    function showResults(data) {
        results.innerHTML = '';
        if (data.results.length == 0) {
            results.innerHTML = '<p>No products found</p>';
            return;
        }

        for (var i = 0; i < data.results.length; i++) {
            var product = data.results[i];
            var div = document.createElement('div');
            div.innerHTML = product.name + ' - $' + product.price;
            div.style.cursor = 'pointer';
            div.style.padding = '5px';
            div.style.borderBottom = '1px solid #ccc';

            div.onclick = (function(p) {
                return function() {
                    selectProduct(p);
                };
            })(product);

            results.appendChild(div);
        }
    }


    function selectProduct(product) {
        searchBox.value = product.name;
        results.innerHTML = '';

        selected.innerHTML =
            '<img src="' + product.image_url + '" width="200" style="margin-top:20px; border-radius:10px; display:block;">' +
            '<h3>' + product.name + '</h3>' +
            '<p>Price: $' + product.price + '</p>' +
            '<p>Category: ' + product.category + '</p>'+exit
           '<p>Description: ' + product.description + '</p>';
    }

</script>

</body>
</html>
